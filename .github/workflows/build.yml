name: Build

on: workflow_dispatch

permissions:
  contents: read

env:
  BUILD_ROOT: ${{ github.workspace }}/build
  CONFIG_TYPE: Distribution
  # This SDK release is available for Windows, macOS and Linux.
  VULKAN_SDK_VERSION: 1.4.309.0

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      architecture_args: "-A x64"
                      generator: "Visual Studio 18 2026"
                    - os: macos-15
                      architecture_args: >-
                        -DCMAKE_OSX_ARCHITECTURES=arm64
                        -DCMAKE_OSX_DEPLOYMENT_TARGET=12.5
                      generator: "Ninja"
                    - os: ubuntu-latest
                      architecture_args: ""
                      generator: "Ninja"

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                submodules: recursive

            - name: Install Linux GLFW dependencies
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xorg-dev

            # Download the official LunarG SDK for the runner OS and export
            # VULKAN_SDK for Walnut's find_package(Vulkan REQUIRED).
            - name: Install Vulkan SDK
              uses: humbletim/install-vulkan-sdk@v1.2
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}
                cache: true

            - name: Set up LLVM 20 and libc++ (macOS)
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  brew install llvm@20
                  llvm_prefix="$(brew --prefix llvm@20)"
                  export CC="$llvm_prefix/bin/clang"
                  export CXX="$llvm_prefix/bin/clang++"
                  export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
                  export MACOSX_DEPLOYMENT_TARGET=12.5
                  # Homebrew's runtime requires macOS 15. Build only the runtimes for Monterey.
                  runtime_prefix="$RUNNER_TEMP/llvm-runtime"
                  curl --fail --location --retry 3 \
                      https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz \
                      -o "$RUNNER_TEMP/llvm-source.tar.xz"
                  tar -xf "$RUNNER_TEMP/llvm-source.tar.xz" -C "$RUNNER_TEMP"
                  cmake -S "$RUNNER_TEMP/llvm-project-20.1.8.src/runtimes" \
                      -B "$RUNNER_TEMP/llvm-runtime-build" -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$runtime_prefix" \
                      -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.5 \
                      -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
                      -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF \
                      -DLLVM_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
                      -DLIBCXXABI_USE_LLVM_UNWINDER=ON \
                      -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-headerpad_max_install_names"
                  cmake --build "$RUNNER_TEMP/llvm-runtime-build" --parallel 3
                  cmake --install "$RUNNER_TEMP/llvm-runtime-build"
                  for component in libcxx libcxxabi libunwind; do
                      mkdir -p "$runtime_prefix/share/licenses/$component"
                      cp "$RUNNER_TEMP/llvm-project-20.1.8.src/$component/LICENSE.TXT" \
                          "$runtime_prefix/share/licenses/$component/"
                  done
                  # Use the headers and libraries from the same runtime build.
                  export CXXFLAGS="-stdlib=libc++ -nostdinc++ -isystem $runtime_prefix/include/c++/v1"
                  export LDFLAGS="-L$runtime_prefix/lib -Wl,-rpath,$runtime_prefix/lib -Wl,-headerpad_max_install_names -lunwind"
                  {
                      echo "CC=$CC"
                      echo "LLVM_ROOT=$runtime_prefix"
                      echo "CXX=$CXX"
                      echo "SDKROOT=$SDKROOT"
                      echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
                      echo "CXXFLAGS=$CXXFLAGS"
                      echo "LDFLAGS=$LDFLAGS"
                  } >> "$GITHUB_ENV"
                  "$CXX" --version

            - name: Configure (CMake)
              shell: pwsh
              run: >
                  cmake -S . -B "${{ env.BUILD_ROOT }}/${{ matrix.os }}"
                  -G "${{ matrix.generator }}"
                  ${{ matrix.architecture_args }}
                  -DCMAKE_BUILD_TYPE=${{ env.CONFIG_TYPE }}

            - name: Build
              shell: pwsh
              run: >
                  cmake --build "${{ env.BUILD_ROOT }}/${{ matrix.os }}"
                  --config ${{ env.CONFIG_TYPE }}

            - name: Package release
              shell: pwsh
              run: >
                  cpack --config "${{ env.BUILD_ROOT }}/${{ matrix.os }}/CPackConfig.cmake"
                  -C "${{ env.CONFIG_TYPE }}"
                  -B "${{ env.BUILD_ROOT }}/artifacts"

            # Diagnostic only: report the minimum OS of the shipped ARM64 binaries.
            - name: Inspect macOS compatibility
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  inspection_dir="$(mktemp -d "$RUNNER_TEMP/macos-compatibility.XXXXXX")"
                  for archive in "$BUILD_ROOT"/artifacts/*.zip; do
                      ditto -x -k "$archive" "$inspection_dir"
                  done
                  app="$inspection_dir/JPLSpatialApplication.app"
                  while IFS= read -r -d '' binary; do
                      if file -b "$binary" | grep -q 'Mach-O'; then
                          echo "::group::${binary#"$inspection_dir/"}"
                          xcrun vtool -arch arm64 -show-build "$binary"
                          echo "::endgroup::"
                      fi
                  done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ matrix.os }}
                path: |
                  ${{ env.BUILD_ROOT }}/artifacts/*.zip
                  ${{ env.BUILD_ROOT }}/artifacts/*.tar.gz
                retention-days: 3
                if-no-files-found: error
