name: Build

on: workflow_dispatch

permissions:
  contents: read

env:
  BUILD_ROOT: ${{ github.workspace }}/build
  CONFIG_TYPE: Distribution
  # This SDK release is available for Windows, macOS and Linux.
  VULKAN_SDK_VERSION: 1.4.309.0

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      architecture_args: "-A x64"
                      generator: "Visual Studio 18 2026"
                    - os: macos-15-intel
                      architecture_args: ""
                      generator: "Ninja"
                    - os: ubuntu-latest
                      architecture_args: ""
                      generator: "Ninja"

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                submodules: recursive

            # Keep this patch until the same fix is available in WalnutCMake.
            - name: Enable MoltenVK portability in Walnut
              if: runner.os == 'macOS'
              shell: bash
              run: git apply --directory=SpatialApplication/vendor/Walnut .github/patches/walnut-macos-vulkan.patch

            - name: Install Linux GLFW dependencies
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xorg-dev

            # Download the official LunarG SDK for the runner OS and export
            # VULKAN_SDK for Walnut's find_package(Vulkan REQUIRED).
            - name: Install Vulkan SDK
              uses: humbletim/install-vulkan-sdk@v1.2
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}
                cache: true

            - name: Set up LLVM 20 and libc++ (macOS Intel)
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  brew install llvm@20
                  llvm_prefix="$(brew --prefix llvm@20)"
                  export CC="$llvm_prefix/bin/clang"
                  export CXX="$llvm_prefix/bin/clang++"
                  export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
                  export MACOSX_DEPLOYMENT_TARGET=15.0
                  # Select LLVM's headers AND runtime, not Apple's system libc++.
                  export CXXFLAGS="-stdlib=libc++ -nostdinc++ -isystem $llvm_prefix/include/c++/v1"
                  export LDFLAGS="-L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -Wl,-rpath,$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/unwind -Wl,-headerpad_max_install_names -lunwind"
                  {
                      echo "CC=$CC"
                      echo "LLVM_ROOT=$llvm_prefix"
                      echo "CXX=$CXX"
                      echo "SDKROOT=$SDKROOT"
                      echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
                      echo "CXXFLAGS=$CXXFLAGS"
                      echo "LDFLAGS=$LDFLAGS"
                  } >> "$GITHUB_ENV"
                  "$CXX" --version

            - name: Configure (CMake)
              shell: pwsh
              run: >
                  cmake -S . -B "${{ env.BUILD_ROOT }}/${{ matrix.os }}"
                  -G "${{ matrix.generator }}"
                  ${{ matrix.architecture_args }}
                  -DCMAKE_BUILD_TYPE=${{ env.CONFIG_TYPE }}

            - name: Build
              shell: pwsh
              run: >
                  cmake --build "${{ env.BUILD_ROOT }}/${{ matrix.os }}"
                  --config ${{ env.CONFIG_TYPE }}

            - name: Package release
              shell: pwsh
              run: >
                  cpack --config "${{ env.BUILD_ROOT }}/${{ matrix.os }}/CPackConfig.cmake"
                  -C "${{ env.CONFIG_TYPE }}"
                  -B "${{ env.BUILD_ROOT }}/artifacts"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ matrix.os }}
                path: |
                  ${{ env.BUILD_ROOT }}/artifacts/*.zip
                  ${{ env.BUILD_ROOT }}/artifacts/*.tar.gz
                retention-days: 3
                if-no-files-found: error
